name: Qualidade de código e testes E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: ESLint, Prettier e testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Executar ESLint
        run: npm run lint
      - name: Verificar formatação
        run: npm run format:check
      - name: Executar testes unitários
        run: npm run test:unit
      - name: Validar build da Cloudflare Pages
        run: npm run build

  playwright:
    name: Playwright no Chromium
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Instalar navegador do Playwright
        run: npx --yes playwright@1.57.0 install --with-deps chromium
      - name: Executar testes E2E
        run: npm run test:e2e
      - name: Anexar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
